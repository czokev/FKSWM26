<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM-Tippspiel der Schule</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }
        .container {
            max-width: 700px; 
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #004494; text-align: center; }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px; 
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        button {
            width: 100%;
            background-color: #004494;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover { background-color: #003377; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .game-card {
            border: 1px solid #e1e4e8;
            padding: 10px 15px; 
            margin-bottom: 10px;
            border-radius: 6px;
            background: #fafbfc;
            transition: all 0.3s ease; /* Weicher Übergang für optische Effekte */
        }
        
        /* NEU: Optische Hervorhebung (Ausgrauen) für gesperrte Spiele */
        .game-card.locked-game {
            background-color: #e9ecef; /* Dunkleres Grau als Hintergrund */
            opacity: 0.65; /* Macht das Feld etwas transparent / blasser */
            border: 1px dashed #ccc; /* Gestrichelter Rand statt durchgehend */
        }
        .game-card.locked-game input {
            background-color: #f5f5f5; /* Macht die Eingabefelder selbst grau */
            color: #777; /* Macht die getippten Zahlen blasser */
            border-color: #ddd;
        }

        .game-header { 
            font-size: 0.85em; 
            color: #666; 
            margin-bottom: 8px; 
            text-align: center; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 5px; 
        }
        
        .matchup-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        }
        .team-name { 
            flex: 1; 
            font-weight: bold; 
            font-size: 1em; 
        }
        .team-name.home { text-align: right; }
        .team-name.away { text-align: left; }
        
        .score-inputs { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-weight: bold;
        }
        .score-inputs input { 
            width: 45px; 
            padding: 8px;
            text-align: center; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f0f2f5; }
        
        #message-box { text-align: center; margin-bottom: 15px; font-weight: bold; color: #d9534f; }
        .loader { text-align: center; font-style: italic; color: #666; margin: 10px 0; }

        #floating-save-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            z-index: 1000;
        }
        #floating-save-bar button {
            max-width: 600px;
            margin: 0;
            background-color: #28a745;
        }
        #floating-save-bar button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>WM-Tippspiel</h1>
    <div id="message-box"></div>

    <div id="login-view">
        <p style="text-align: center;">Bitte logge dich mit den Zugangsdaten ein, die du von deiner Lehrkraft erhalten hast.</p>
        <label for="username">Name (Schüler/Lehrer):</label>
        <input type="text" id="username" placeholder="Dein Name">
        <label for="password">Passwort:</label>
        <input type="password" id="password" placeholder="Dein Passwort">
        <button onclick="login()">Anmelden</button>
        <div id="login-loader" class="loader hidden">Verbindung wird hergestellt...</div>
    </div>

    <div id="main-view" class="hidden">
        <div class="nav-buttons">
            <button onclick="showSection('tipps')">Tippabgabe</button>
            <button onclick="showSection('dashboard')">Dashboard & Ranking</button>
        </div>

        <div id="data-loader" class="loader hidden">Daten werden geladen...</div>

        <div id="tipps-section">
            <h2>Spiele tippen</h2>
            <div id="games-container"></div>
            
            <div id="floating-save-bar">
                <button onclick="saveAllTipps()" id="btn-save-all">Alle Tipps speichern</button>
            </div>
        </div>

        <div id="dashboard-section" class="hidden">
            <h2>Aktuelles Ranking</h2>
            <table>
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Name</th>
                        <th>Punkte</th>
                    </tr>
                </thead>
                <tbody id="ranking-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- KONFIGURATION ---
    const API_URL = "HIER_DIE_KOPIERTE_URL_EINTRAGEN";

    let currentUser = "";
    let currentPassword = "";

    function showMessage(msg) {
        const box = document.getElementById('message-box');
        box.innerText = msg;
        setTimeout(() => box.innerText = '', 5000);
    }

    function showSection(sectionId) {
        document.getElementById('tipps-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById(sectionId + '-section').classList.remove('hidden');
        
        if (sectionId === 'tipps' || sectionId === 'dashboard') {
            loadData();
        }
    }

    async function login() {
        const nameInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value.trim();

        if (!nameInput || !passInput) {
            showMessage("Bitte Name und Passwort eingeben.");
            return;
        }

        document.getElementById('login-loader').classList.remove('hidden');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', name: nameInput, password: passInput })
            });
            const result = await response.json();

            if (result.success) {
                currentUser = nameInput;
                currentPassword = passInput;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                showSection('tipps');
            } else {
                showMessage(result.error);
            }
        } catch (error) {
            showMessage("Fehler bei der Verbindung zum Server.");
        } finally {
            document.getElementById('login-loader').classList.add('hidden');
        }
    }

    async function loadData() {
        document.getElementById('data-loader').classList.remove('hidden');
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getData', name: currentUser }) 
            });
            const result = await response.json();

            if (result.success) {
                renderGames(result.spiele, result.userTipps);
                renderRanking(result.ranking);
            } else {
                showMessage("Fehler beim Laden der Daten.");
            }
        } catch (error) {
            showMessage("Fehler bei der Verbindung zum Server.");
        } finally {
            document.getElementById('data-loader').classList.add('hidden');
        }
    }

    function renderGames(spiele, userTipps) {
        const container = document.getElementById('games-container');
        container.innerHTML = '';

        spiele.forEach(spiel => {
            const isLocked = spiel.status === 'gesperrt';
            
            let zeitString = "Zeit unbekannt";
            if(spiel.zeit) {
                const d = new Date(spiel.zeit);
                zeitString = d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'}) + ' Uhr';
            }

            let existingTipp = userTipps.find(t => t.spielId == spiel.id);
            let valH = existingTipp ? existingTipp.tippH : '';
            let valA = existingTipp ? existingTipp.tippA : '';

            const card = document.createElement('div');
            
            // NEU: Wenn das Spiel gesperrt ist, weisen wir ihm zusätzlich die neue CSS-Klasse zu
            card.className = isLocked ? 'game-card locked-game' : 'game-card';
            
            card.innerHTML = `
                <div class="game-header">${spiel.phase} - ${zeitString} ${isLocked ? '(Gesperrt)' : ''}</div>
                <div class="matchup-row">
                    <div class="team-name home">${spiel.heim}</div>
                    <div class="score-inputs">
                        <input type="number" id="heim_${spiel.id}" min="0" value="${valH}" ${isLocked ? 'disabled' : ''}>
                        <span>:</span>
                        <input type="number" id="auswaerts_${spiel.id}" min="0" value="${valA}" ${isLocked ? 'disabled' : ''}>
                    </div>
                    <div class="team-name away">${spiel.auswaerts}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderRanking(ranking) {
        const tbody = document.getElementById('ranking-body');
        tbody.innerHTML = '';
        
        ranking.sort((a, b) => b.punkte - a.punkte);

        ranking.forEach((user, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${user.name}</td>
                <td>${user.punkte}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function saveAllTipps() {
        const btn = document.getElementById('btn-save-all');
        btn.disabled = true;
        btn.innerText = "Speichere...";
        
        const heimInputs = document.querySelectorAll('input[id^="heim_"]');
        let tippsToSave = [];

        heimInputs.forEach(inputH => {
            const spielId = inputH.id.split('_')[1];
            const inputA = document.getElementById('auswaerts_' + spielId);

            if (!inputH.disabled && inputH.value !== "" && inputA.value !== "") {
                tippsToSave.push({
                    spielId: spielId,
                    tippH: inputH.value,
                    tippA: inputA.value
                });
            }
        });

        if (tippsToSave.length === 0) {
            showMessage("Keine neuen oder gültigen Tipps zum Speichern gefunden.");
            btn.disabled = false;
            btn.innerText = "Alle Tipps speichern";
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'saveAllTipps', 
                    name: currentUser, 
                    password: currentPassword,
                    tipps: tippsToSave
                })
            });
            const result = await response.json();

            if (result.success) {
                showMessage(result.message);
            } else {
                showMessage("Fehler: " + result.error);
            }
        } catch (error) {
            showMessage("Fehler beim Speichern der Daten.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Alle Tipps speichern";
        }
    }
</script>

</body>
</html>
